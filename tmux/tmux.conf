# Keymap:
#
# Leader: Ctrl-a
set -g prefix C-a

# Horizontal split: Ctrl-a -
bind - split-window -v
unbind '"'

# change prefix to Ctrl+a
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix

# Ensure that we can send Ctrl-a to other apps
bind C-a send-prefix

# Reload config with Ctrl+R
bind C-r source-file $HOME/dotfiles/tmux/tmux.conf

# switch panes using Ctrl+arrow
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Resize panes using Ctrl+Shift+arrow
bind -n C-S-Left resize-pane -L 10
bind -n C-S-Right resize-pane -R 10
bind -n C-S-Up resize-pane -U 10
bind -n C-S-Down resize-pane -D 10

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour255 bg=colour18 bold'

# panes
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour11'

# Let me use my mouse
set-option -g mouse on
